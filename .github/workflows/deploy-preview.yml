name: Deploy private preview

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run ID from main
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: verbulio-private-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_HOST: deploy-verbulio@151.240.121.172
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the CI run and download its package
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
          revision="$(jq -er --arg repo "$GITHUB_REPOSITORY" '
            select(.path == ".github/workflows/ci.yml" and .event == "push"
              and .head_branch == "main" and .conclusion == "success"
              and .head_repository.full_name == $repo) | .head_sha
          ' <<< "$run")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          cd "$RUNNER_TEMP"
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name verbulio-preview
          [[ "$(tar -xOzf verbulio-preview.tar.gz ./REVISION)" == "$revision" ]]
          sha256sum verbulio-preview.tar.gz > SHA256SUMS
          printf 'PREVIEW_REVISION=%s\n' "$revision" >> "$GITHUB_ENV"

      - name: Transfer the verified package and activate the preview
        env:
          PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PREVIEW_SSH_KEY" ]]; then
            printf 'Configure the dedicated PREVIEW_SSH_KEY secret first.\n' >&2
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$PREVIEW_SSH_KEY" > "$ssh_dir/identity"
          unset PREVIEW_SSH_KEY
          cat > "$ssh_dir/known_hosts" <<'KEY'
          151.240.121.172 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGYTMIG6vPOaHudYMg85u011tS/Shg2OBYDCTgWhBfxH
          KEY
          ssh_options=(-F /dev/null -i "$ssh_dir/identity"
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o VerifyHostKeyDNS=no
            -o HostKeyAlgorithms=ssh-ed25519)
          remote="$(ssh "${ssh_options[@]}" "$PREVIEW_HOST" 'mktemp -d /srv/Verbulio-preview/.incoming.XXXXXXXX')"
          [[ "$remote" =~ ^/srv/Verbulio-preview/\.incoming\.[A-Za-z0-9]{8}$ ]]
          scp "${ssh_options[@]}" "$RUNNER_TEMP/verbulio-preview.tar.gz" "$RUNNER_TEMP/SHA256SUMS" \
            scripts/preview/{compose.yaml,deploy.sh} "$PREVIEW_HOST:$remote/"
          ssh "${ssh_options[@]}" "$PREVIEW_HOST" "bash '$remote/deploy.sh' '$remote/verbulio-preview.tar.gz' '$PREVIEW_REVISION' && rm -rf -- '$remote'"
