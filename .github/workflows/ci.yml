name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: api/global.json
      - name: Package private preview
        working-directory: .
        run: bash scripts/build-preview.sh "$RUNNER_TEMP/verbulio-preview.tar.gz"
      - name: Keep the integrated preview package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: verbulio-preview
          path: ${{ runner.temp }}/verbulio-preview.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__Learning: Host=127.0.0.1;Port=5432;Database=verbulio;Username=postgres;Password=local-ci-fixture
      ConnectionStrings__AccountDeletionJournal: Host=127.0.0.1;Port=5432;Database=verbulio_deletions;Username=postgres;Password=local-ci-fixture
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: verbulio
          POSTGRES_PASSWORD: local-ci-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d verbulio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: api/global.json
      - run: dotnet restore Verbulio.Learning.Tests
      - run: dotnet restore Verbulio.Api
      - name: Check C# formatting
        run: |
          for project in Verbulio.Learning Verbulio.Learning.Tests Verbulio.Api; do
            dotnet format whitespace "$project/$project.csproj" --verify-no-changes --no-restore || exit
          done
      - run: dotnet test Verbulio.Learning.Tests -c Release --no-restore
        env:
          VERBULIO_CONFIRMATION_TEST_DB: ${{ env.ConnectionStrings__Learning }}
      - run: dotnet build Verbulio.Api -c Release --no-restore
      - run: python3 checks/public_site.py
      - run: python3 checks/local_learning.py
        env:
          VERBULIO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}


  public-package:
    name: Public package
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: api/global.json
      - name: Package the public site
        working-directory: .
        run: bash scripts/build-preview.sh "$RUNNER_TEMP/verbulio-public.tar.gz" public
      - name: Keep the integrated public package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: verbulio-public-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verbulio-public.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
