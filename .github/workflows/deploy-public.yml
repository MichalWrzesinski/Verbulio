name: Deploy public site

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run ID from main
        required: true
        type: string
      ci_run_attempt:
        description: Successful attempt number of the CI run
        required: true
        type: string
      artifact_id:
        description: Immutable public artifact ID for that attempt
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: verbulio-public-site
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_HOST: deploy-verbulio@151.240.121.172
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the CI run and download its package
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ && "$CI_RUN_ATTEMPT" =~ ^[0-9]+$ && "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/attempts/$CI_RUN_ATTEMPT")"
          revision="$(jq -er --arg repo "$GITHUB_REPOSITORY" '
            select(.path == ".github/workflows/ci.yml" and .event == "push"
              and .head_branch == "main" and .conclusion == "success"
              and .head_repository.full_name == $repo) | .head_sha
          ' <<< "$run")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$revision" ]]
          name="verbulio-public-$CI_RUN_ATTEMPT"
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts?name=$name")"
          jq -e --arg id "$ARTIFACT_ID" --arg name "$name" '
            .artifacts | any((.id | tostring) == $id and .name == $name and .expired == false)
          ' <<< "$artifact" >/dev/null
          cd "$RUNNER_TEMP"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > public-artifact.zip
          unzip -p public-artifact.zip verbulio-public.tar.gz > verbulio-public.tar.gz
          [[ "$(tar -xOzf verbulio-public.tar.gz ./REVISION)" == "$revision" ]]
          sha256sum verbulio-public.tar.gz > SHA256SUMS
          printf 'PUBLIC_REVISION=%s\n' "$revision" >> "$GITHUB_ENV"

      - name: Transfer the verified package and activate the public site
        env:
          PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PREVIEW_SSH_KEY" ]]; then
            printf 'Configure the dedicated PREVIEW_SSH_KEY secret first.\n' >&2
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$PREVIEW_SSH_KEY" > "$ssh_dir/identity"
          unset PREVIEW_SSH_KEY
          cat > "$ssh_dir/known_hosts" <<'KEY'
          151.240.121.172 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGYTMIG6vPOaHudYMg85u011tS/Shg2OBYDCTgWhBfxH
          KEY
          ssh_options=(-F /dev/null -i "$ssh_dir/identity"
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o VerifyHostKeyDNS=no
            -o HostKeyAlgorithms=ssh-ed25519)
          remote="$(ssh "${ssh_options[@]}" "$PUBLIC_HOST" 'mktemp -d /srv/Verbulio/.incoming.XXXXXXXX')"
          [[ "$remote" =~ ^/srv/Verbulio/\.incoming\.[A-Za-z0-9]{8}$ ]]
          scp "${ssh_options[@]}" "$RUNNER_TEMP/verbulio-public.tar.gz" "$RUNNER_TEMP/SHA256SUMS" \
            scripts/public/{nginx-location.conf,deploy.sh} "$PUBLIC_HOST:$remote/"
          ssh "${ssh_options[@]}" "$PUBLIC_HOST" "bash '$remote/deploy.sh' '$remote/verbulio-public.tar.gz' '$PUBLIC_REVISION' && rm -rf -- '$remote'"
