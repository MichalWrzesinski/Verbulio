name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: verbulio-public-site
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_HOST: deploy-verbulio@151.240.121.172
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify the CI run and download its package
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PUBLIC_REVISION: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PUBLIC_REVISION" ]]
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" != "$PUBLIC_REVISION" ]]; then
            printf 'Skipping CI for a superseded main revision.\n'
            exit 0
          fi
          name="verbulio-public-$CI_RUN_ATTEMPT"
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts?name=$name" | jq -er --arg name "$name" '
            [.artifacts[] | select(.name == $name and .expired == false)]
              | if length == 1 then .[0] | [.id, (.digest | sub("^sha256:"; ""))] | @tsv else error("Expected one public artifact") end
          ')"
          IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_SHA256 <<< "$artifact"
          INGRESS_SHA256="$(sha256sum scripts/public/nginx-location.conf)"
          INGRESS_SHA256="${INGRESS_SHA256%% *}"
          export VERIFIED_PUBLIC_ARCHIVE="$RUNNER_TEMP/verbulio-public.tar.gz"
          bash scripts/public/verify-candidate.sh "$PUBLIC_REVISION" "$CI_RUN_ID" "$CI_RUN_ATTEMPT" \
            "$ARTIFACT_ID" "$ARTIFACT_SHA256" "$INGRESS_SHA256" | tee -a "$GITHUB_STEP_SUMMARY"
          cd "$RUNNER_TEMP"
          sha256sum verbulio-public.tar.gz > SHA256SUMS
          printf 'PUBLIC_REVISION=%s\nINGRESS_SHA256=%s\n' "$PUBLIC_REVISION" "$INGRESS_SHA256" >> "$GITHUB_ENV"

      - name: Transfer the verified package and activate the staging site
        if: env.PUBLIC_REVISION != ''
        env:
          PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" != "$PUBLIC_REVISION" ]]; then
            printf 'Skipping package for a superseded main revision.\n'
            exit 0
          fi
          if [[ -z "$PREVIEW_SSH_KEY" ]]; then
            printf 'Configure the dedicated PREVIEW_SSH_KEY secret first.\n' >&2
            exit 1
          fi
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$PREVIEW_SSH_KEY" > "$ssh_dir/identity"
          unset PREVIEW_SSH_KEY
          cat > "$ssh_dir/known_hosts" <<'KEY'
          151.240.121.172 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGYTMIG6vPOaHudYMg85u011tS/Shg2OBYDCTgWhBfxH
          KEY
          ssh_options=(-F /dev/null -i "$ssh_dir/identity"
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o VerifyHostKeyDNS=no
            -o HostKeyAlgorithms=ssh-ed25519)
          remote="$(ssh "${ssh_options[@]}" "$PUBLIC_HOST" 'mktemp -d /srv/Verbulio/.incoming.XXXXXXXX')"
          [[ "$remote" =~ ^/srv/Verbulio/\.incoming\.[A-Za-z0-9]{8}$ ]]
          scp "${ssh_options[@]}" "$RUNNER_TEMP/verbulio-public.tar.gz" "$RUNNER_TEMP/SHA256SUMS" \
            scripts/public/{nginx-location.conf,deploy.sh} "$PUBLIC_HOST:$remote/"
          ssh "${ssh_options[@]}" "$PUBLIC_HOST" "bash '$remote/deploy.sh' '$remote/verbulio-public.tar.gz' '$PUBLIC_REVISION' '$INGRESS_SHA256' && rm -rf -- '$remote'"
