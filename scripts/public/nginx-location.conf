# Include in the TLS server block for verbulio.gitpush.app in place of its static location /.
location / {
    proxy_pass http://127.0.0.1:5444;
    proxy_http_version 1.1;

    # Establish the trusted request identity at the public edge.
    proxy_set_header Host verbulio.gitpush.app;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
}
